{% extends "base.html" %}
{% block title %}轉檔{% endblock %}
{% block content %}
<div style="background-color: #efefef; padding: 10px; margin: 10px;border-radius: 10px;">
    <form id="convertForm" action="/upload" method="post" enctype="multipart/form-data">
        <h4 style="color: #4b4a4a; margin: 5px;">轉檔</h4>
        <div class="row" style="padding: 10px;">
            <div class="col-6">
                <span><b>請選擇要計算的項目</b></span>
                <div id="checkList">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" value="COP" checked>
                        <label class="form-check-label">COP</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" value="" disabled>
                        <label class="form-check-label">other</label>
                    </div>
                </div>
            </div>
            <div class="col-6">
                <label for="weight" class="form-label">
                    <b>請輸入受試者體重(kg)</b>
                    <i class="bi bi-exclamation-circle" data-bs-toggle="tooltip" data-bs-html="true" title="若上傳多個檔案<br>皆會以輸入的體重做計算" data-bs-placement="right" data-bs-custom-class="custom-tooltip" style="color:red; margin-left: 5px;font-size: 1.2rem;"></i>
                </label>
                <input class="form-control" type="number" min="1" id="weight">
            </div>
            <div class="col-6">
                <label for="formFileMultiple" class="form-label"><b>上傳多個.txt文字檔</b><i class="bi bi-filetype-txt" style="margin-left: 5px;"></i></label>
                <input class="form-control" type="file" multiple accept=".txt,.csv">
            </div>
            <div class="col-6" style="display: flex; align-items: end; justify-content: end; gap: 10px;">
                <button id="submitBtn" class="btn btn-outline-success btn-rounded" type="submit">上傳</button>
                <button id="loadBtn" class="btn btn-outline-success btn-rounded" type="button" style="display: none;" disabled>
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="vertical-align: baseline;"></span>
                    轉檔中...
                </button> 
                <button id="downloadBtn" class="btn btn-outline-primary btn-rounded" type="button" style="display: none;">下載excel</button>
            </div>
        </div>
    </form>     
</div>

<div style="background-color: #efefef; padding: 10px; margin: 10px;border-radius: 10px;">
    <form id="trimForm" action="/trim_upload" method="post" enctype="multipart/form-data">
        <h4 style="color: #4b4a4a; margin: 5px;">12欄位 txt 刪除測力板資料</h4>
        <div class="row" style="padding: 10px;">
            <div class="col-12" style="margin-bottom: 10px;">
                <span><b>請選擇要刪除的區塊</b></span>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="delete_block" id="deleteFirst" value="first" checked>
                    <label class="form-check-label" for="deleteFirst">
                        刪除第一塊測力板（前六個欄位：1~6 欄）
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="delete_block" id="deleteSecond" value="second">
                    <label class="form-check-label" for="deleteSecond">
                        刪除第二塊測力板（後六個欄位：7~12 欄）
                    </label>
                </div>
                <small class="text-muted">
                    ※ 適用於原本為 12 欄位的 txt 檔案，處理後會只保留一塊測力板（6 欄位），並將結果打包為壓縮檔供下載。
                </small>
            </div>
            <div class="col-6">
                <label class="form-label"><b>上傳 12 欄位 .txt 文字檔</b><i class="bi bi-filetype-txt" style="margin-left: 5px;"></i></label>
                <input class="form-control" type="file" name="files" multiple accept=".txt,.csv">
            </div>
            <div class="col-6" style="display: flex; align-items: end; justify-content: end; gap: 10px;">
                <button id="trimSubmitBtn" class="btn btn-outline-success btn-rounded" type="submit">刪除並打包</button>
                <button id="trimLoadBtn" class="btn btn-outline-success btn-rounded" type="button" style="display: none;" disabled>
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="vertical-align: baseline;"></span>
                    處理中...
                </button> 
                <button id="trimDownloadBtn" class="btn btn-outline-primary btn-rounded" type="button" style="display: none;">下載處理後壓縮檔</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
{% endblock %}
